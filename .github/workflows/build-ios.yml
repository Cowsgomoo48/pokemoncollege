name: Build iPhone app (unsigned IPA)

# Run it from the repo's Actions tab with "Run workflow", or it runs on every push.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create the iOS project (first run only)
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi

      - name: Make sure the www folder exists
        run: |
          if [ ! -d www ]; then
            mkdir www
            cp index.html manifest.webmanifest sw.js icon-180.png icon-192.png icon-512.png www/
          fi
          if [ ! -f resources/icon-512.png ]; then
            mkdir -p resources
            cp www/icon-512.png resources/icon-512.png
          fi

      - name: Use the PokémonCollege icon
        run: |
          ICON=ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          if [ -f "$ICON" ]; then
            sips -z 1024 1024 resources/icon-512.png --out "$ICON"
          fi

      - name: Allow microphone, camera, photos, speech recognition and recording with the screen locked
        run: |
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSMicrophoneUsageDescription" $PL 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string ChatTalk records your lectures so they can be transcribed on this iPhone." $PL
          /usr/libexec/PlistBuddy -c "Delete :NSSpeechRecognitionUsageDescription" $PL 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string ChatTalk turns your recordings into text on this iPhone, without sending them anywhere." $PL
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" $PL 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string PokéPics takes photos of notes and slides so their text can be read on this iPhone." $PL
          /usr/libexec/PlistBuddy -c "Delete :NSPhotoLibraryUsageDescription" $PL 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string PokéPics adds photos of notes and slides from your library." $PL
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" $PL 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" $PL
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" $PL

      - name: Copy web files into the app
        run: npx cap sync ios

      - name: Build without signing
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package the .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r -q PokemonCollege.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PokemonCollege-ipa
          path: PokemonCollege.ipa
